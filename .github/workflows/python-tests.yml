name: Run tests

on:
  pull_request:
  push:
    branches:
      - add/auth-tests

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          if [ -f site-manager/backend/requirements.txt ]; then
            pip install -r site-manager/backend/requirements.txt
          else
            pip install pytest fastapi sqlmodel httpx PyJWT sqlalchemy aiosqlite
          fi
      - name: Run pytest
        run: |
          pytest -q
