name: Publish and Deploy
on:
  push:
    branches: [master]
env:
  FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
  FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Format
        run: mise run --affected //...:format
      - name: Build
        run: mise run --affected //...:build
      - name: Publish
        run: mise run --affected //...:publish
      - name: Deploy
        run: mise run --affected //...:deploy
