name: Deploy to FastAPI Cloud
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Get the controller openapi spec
        run: |
          cd controller/backend
          pip install .
          python -c "
          import json
          from app.main import app
          with open('openapi.json', 'w') as f:
              json.dump(app.openapi(), f, indent=2)
          "
      - name: Get the openapi spec
        run: |
          cd site-manager/backend
          pip install .
          python -c "
          import json
          from app.main import app
          with open('openapi.json', 'w') as f:
              json.dump(app.openapi(), f, indent=2)
          "
      - name: Build the controller sdk
        run: |
          cd controller/frontend
          npm ci
          npx openapi-ts -i ../backend/openapi.json -o src/sdk
      - name: Build the frontend
        run: |
          cd site-manager/frontend
          npm ci
          npx openapi-ts -i ../backend/openapi.json -o src/sdk
          npm run build
      - name: Deploy 
        run: |
          cd site-manager/backend
          uv run fastapi deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
